services:
  outline2pptx:
    build: .
    image: outline2pptx
    ports:
      - "8000:8000"
    volumes:
      # Where the CLI in the container reads outlines and writes decks.
      - ./data:/data
    environment:
      # The chat model that plans the outline and writes the slides. Both are required.
      OUTLINE2PPTX_BASE_URL: "${OUTLINE2PPTX_BASE_URL:-http://localhost:11434/v1}"
      OUTLINE2PPTX_MODEL: "${OUTLINE2PPTX_MODEL:-your-model}"
      # Optional, local servers do not need a key.
      OUTLINE2PPTX_API_KEY: "${OUTLINE2PPTX_API_KEY:-}"
      # The image model, each setting falls back to the chat value.
      OUTLINE2PPTX_IMAGE_BASE_URL: "${OUTLINE2PPTX_IMAGE_BASE_URL:-}"
      OUTLINE2PPTX_IMAGE_MODEL: "${OUTLINE2PPTX_IMAGE_MODEL:-}"
      OUTLINE2PPTX_IMAGE_API_KEY: "${OUTLINE2PPTX_IMAGE_API_KEY:-}"
      # The deck itself.
      OUTLINE2PPTX_LANGUAGE: "${OUTLINE2PPTX_LANGUAGE:-en}"
      OUTLINE2PPTX_TEMPLATE: "${OUTLINE2PPTX_TEMPLATE:-clean}"
      OUTLINE2PPTX_TEMPLATE_DIR: "${OUTLINE2PPTX_TEMPLATE_DIR:-}"
      OUTLINE2PPTX_SLIDES: "${OUTLINE2PPTX_SLIDES:-}"
      OUTLINE2PPTX_IMAGES: "${OUTLINE2PPTX_IMAGES:-0}"
      OUTLINE2PPTX_NOTES: "${OUTLINE2PPTX_NOTES:-0}"
      OUTLINE2PPTX_PRESENTER: "${OUTLINE2PPTX_PRESENTER:-}"
      OUTLINE2PPTX_INSTRUCTIONS: "${OUTLINE2PPTX_INSTRUCTIONS:-}"
      OUTLINE2PPTX_STYLE_TEXT: "${OUTLINE2PPTX_STYLE_TEXT:-}"
      OUTLINE2PPTX_NOTICE: "${OUTLINE2PPTX_NOTICE:-}"
      # Limits.
      OUTLINE2PPTX_BATCH: "${OUTLINE2PPTX_BATCH:-5}"
      OUTLINE2PPTX_WRITE_PARALLELISM: "${OUTLINE2PPTX_WRITE_PARALLELISM:-3}"
      OUTLINE2PPTX_IMAGE_PARALLELISM: "${OUTLINE2PPTX_IMAGE_PARALLELISM:-4}"
      OUTLINE2PPTX_TIMEOUT: "${OUTLINE2PPTX_TIMEOUT:-180}"
      OUTLINE2PPTX_IMAGE_TIMEOUT: "${OUTLINE2PPTX_IMAGE_TIMEOUT:-300}"
      OUTLINE2PPTX_MAX_RETRIES: "${OUTLINE2PPTX_MAX_RETRIES:-2}"
